<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">QwenFX</title>
<desc id="desc">QwenFX: a coding agent, running inside the weights of the model it drives. fx, Vercel's coding agent, runs as its exact RV32 binary on the CPU compiled into Qwen3.5-4B, with that Qwen as its model: a stream of chip tokens, a one-line fix, and the pull requests it opened.</desc>
