[project]
name = "qwenfx"
version = "0.1.0"
description = "fx, Vercel's coding agent, as its exact binary on a RISC-V CPU compiled into Qwen3.5-4B's weights"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "pyelftools>=0.31",
    "jinja2>=3.1",
    "tokenizers>=0.21",
    "huggingface-hub>=0.30",
]

[project.optional-dependencies]
hf = [
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
wasm = ["wasmtime"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chipformer"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
